<style id="delnavazan-password-handoff-style">
  #delnavazan-password-handoff {
    position: fixed;
    inset: 0;
    z-index: 2147483000;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(16, 20, 35, 0.62);
    direction: rtl;
  }
  #delnavazan-password-handoff-card {
    box-sizing: border-box;
    width: min(100%, 440px);
    max-height: calc(100vh - 36px);
    overflow: auto;
    padding: 28px 24px 22px;
    border: 1px solid #e7dcf0;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 22px 70px rgba(18, 8, 31, 0.3);
    color: #392246;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.9;
    text-align: center;
  }
  #delnavazan-password-handoff-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 58px;
    height: 58px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: #edf8f0;
    color: #24733d;
    font-size: 31px;
    font-weight: 800;
    line-height: 1;
  }
  #delnavazan-password-handoff-title {
    display: block;
    margin-bottom: 8px;
    color: #40244f;
    font-size: 21px;
    line-height: 1.55;
  }
  #delnavazan-password-handoff-message {
    display: block;
    margin-bottom: 20px;
    color: #5d4b66;
  }
  #delnavazan-password-handoff-actions {
    display: grid;
    gap: 10px;
  }
  #delnavazan-password-handoff button {
    box-sizing: border-box;
    width: 100%;
    min-height: 48px;
    padding: 11px 16px;
    border-radius: 10px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  #delnavazan-password-create {
    border: 1px solid #6d357e;
    background: #6d357e;
    color: #fff;
  }
  #delnavazan-password-details {
    border: 1px solid #d7c9df;
    background: #fff;
    color: #5c326b;
  }
  #delnavazan-password-create:focus-visible,
  #delnavazan-password-details:focus-visible {
    outline: 3px solid rgba(109, 53, 126, 0.28);
    outline-offset: 2px;
  }
  @media (max-width: 480px) {
    #delnavazan-password-handoff {
      align-items: flex-end;
      padding: 10px;
    }
    #delnavazan-password-handoff-card {
      width: 100%;
      max-height: calc(100vh - 20px);
      padding: 24px 18px 18px;
      border-radius: 18px 18px 12px 12px;
    }
  }
  #delnavazan-returning-student-message {
    box-sizing: border-box;
    margin: 12px 0;
    padding: 14px 16px;
    border: 1px solid #e5c778;
    border-radius: 10px;
    background: #fff9e8;
    color: #533d0c;
    font-size: 14px;
    line-height: 1.9;
    text-align: right;
    direction: rtl;
  }
  #delnavazan-returning-student-message a {
    display: inline-flex;
    margin-top: 9px;
    padding: 8px 14px;
    border-radius: 7px;
    background: #6d357e;
    color: #fff !important;
    font-weight: 700;
    text-decoration: none !important;
  }
</style>
<script>
(function () {
  'use strict';

  var enrolPath = window.location.pathname.replace(/\/+$/, '');
  if (enrolPath !== '/enrol' || window.__delnavazanPasswordHandoffInstalled) return;
  window.__delnavazanPasswordHandoffInstalled = true;
  document.documentElement.setAttribute('data-delnavazan-password-handoff', 'ready');

  var handoffReady = false;
  var attempts = 0;
  var timer = 0;
  var genericPaymentError = 'Sorry, there was an error processing your payment. Please try again later.';

  function normalizedText(element) {
    return String(element && element.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function isPasswordAction(element) {
    var text = normalizedText(element);
    return /کلمه\s*عبور.*درگاه\s*هنرجو/.test(text) ||
      /گذرواژه.*درگاه\s*هنرجو/.test(text) ||
      /set\s+password/i.test(text);
  }

  function hasBookingConfirmation(root) {
    var text = normalizedText(root);
    return /Appointment\s+ID\s*#?\s*\d+/i.test(text) ||
      /شناسه.{0,20}(رزرو|کلاس).{0,10}\d+/.test(text);
  }

  function showHandoffNotice(action) {
    if (document.getElementById('delnavazan-password-handoff')) return;
    var overlay = document.createElement('div');
    overlay.id = 'delnavazan-password-handoff';
    var notice = document.createElement('div');
    notice.id = 'delnavazan-password-handoff-card';
    notice.setAttribute('role', 'dialog');
    notice.setAttribute('aria-modal', 'true');
    notice.setAttribute('aria-labelledby', 'delnavazan-password-handoff-title');
    notice.setAttribute('aria-describedby', 'delnavazan-password-handoff-message');
    var icon = document.createElement('span');
    icon.id = 'delnavazan-password-handoff-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = '\u2713';
    var title = document.createElement('strong');
    title.id = 'delnavazan-password-handoff-title';
    title.textContent = 'رزرو شما با موفقیت ثبت شد';
    var message = document.createElement('span');
    message.id = 'delnavazan-password-handoff-message';
    message.textContent = 'برای ورود امن به درگاه هنرجو، اکنون گذرواژه خود را انتخاب کنید. همچنین می‌توانید ابتدا جزئیات رزرو را مشاهده کنید.';
    var actions = document.createElement('div');
    actions.id = 'delnavazan-password-handoff-actions';
    var passwordButton = document.createElement('button');
    passwordButton.id = 'delnavazan-password-create';
    passwordButton.type = 'button';
    passwordButton.textContent = 'انتخاب گذرواژه درگاه هنرجو';
    var detailsButton = document.createElement('button');
    detailsButton.id = 'delnavazan-password-details';
    detailsButton.type = 'button';
    detailsButton.textContent = 'مشاهده جزئیات رزرو';
    passwordButton.addEventListener('click', function () {
      document.documentElement.setAttribute('data-delnavazan-password-handoff', 'opening-native');
      overlay.remove();
      action.click();
    });
    detailsButton.addEventListener('click', function () {
      document.documentElement.setAttribute('data-delnavazan-password-handoff', 'details');
      overlay.remove();
    });
    actions.appendChild(passwordButton);
    actions.appendChild(detailsButton);
    notice.appendChild(icon);
    notice.appendChild(title);
    notice.appendChild(message);
    notice.appendChild(actions);
    overlay.appendChild(notice);
    document.body.appendChild(overlay);
    document.documentElement.setAttribute('data-delnavazan-password-handoff', 'awaiting-choice');
    passwordButton.focus();
  }

  function findAndOpenNativePasswordAction() {
    if (handoffReady) return true;
    if (typeof document === 'undefined' || !document.body) return false;
    var scope = document.body;
    if (!scope || !hasBookingConfirmation(scope)) return false;

    var candidates = scope.querySelectorAll('button, a, [role="button"]');
    for (var i = 0; i < candidates.length; i++) {
      if (!isPasswordAction(candidates[i])) continue;
      var action = candidates[i];
      handoffReady = true;
      showHandoffNotice(action);
      return true;
    }
    return false;
  }

  function replaceFalsePaymentMessage() {
    if (typeof document === 'undefined' || !document.querySelectorAll) return false;
    var elements = document.querySelectorAll('div, p, span');
    for (var i = 0; i < elements.length; i++) {
      var element = elements[i];
      if (
        element.id === 'delnavazan-returning-student-message' ||
        element.children.length ||
        normalizedText(element) !== genericPaymentError
      ) {
        continue;
      }
      var message = document.createElement('div');
      message.id = 'delnavazan-returning-student-message';
      message.setAttribute('role', 'alert');
      message.innerHTML =
        '<strong>رزرو تکمیل نشد و هیچ پرداختی انجام نشده است.</strong><br>' +
        'اگر قبلاً ثبت‌نام کرده‌اید، ابتدا وارد درگاه هنرجو شوید و سپس با همان ایمیل و شماره تلفن حساب خود دوباره رزرو کنید. ' +
        'در غیر این صورت اطلاعات واردشده را بررسی کنید یا با پشتیبانی تماس بگیرید.' +
        '<br><a href="https://delnavazan.com/honarjo/">ورود به درگاه هنرجو</a>';
      element.replaceWith(message);
      document.documentElement.setAttribute('data-delnavazan-booking-error-copy', 'returning-student');
      return true;
    }
    return false;
  }

  function startWatcher() {
    if (typeof document === 'undefined' || !document.body) return;
    var scope = document.body;
    if (!scope) {
      if (++attempts < 120) timer = window.setTimeout(startWatcher, 250);
      return;
    }

    var observer = new MutationObserver(function () {
      replaceFalsePaymentMessage();
      if (findAndOpenNativePasswordAction()) observer.disconnect();
    });
    observer.observe(scope, { childList: true, subtree: true, characterData: true });

    timer = window.setInterval(function () {
      attempts++;
      replaceFalsePaymentMessage();
      if (findAndOpenNativePasswordAction() || attempts >= 240) {
        window.clearInterval(timer);
        observer.disconnect();
      }
    }, 250);
    replaceFalsePaymentMessage();
    findAndOpenNativePasswordAction();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startWatcher, { once: true });
  } else {
    startWatcher();
  }
})();
</script>
